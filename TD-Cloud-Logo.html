<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TD-Cloud Logo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        /* 核心 Logo 样式 */
        .logo-fusion {
            display: flex;
            align-items: center;
            font-size: 52px;
            font-weight: 900; 
            letter-spacing: -1px; 
            text-transform: uppercase;
            line-height: 1;
        }

        /* 'TD' 色块 */
        .logo-fusion .badge {
            background-color: #00c1ff;
            color: #000;
            padding: 6px 14px;
            margin-right: 12px;
            border-radius: 4px; 
            font-size: 0.88em;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.06em; 
            padding-right: calc(14px - 0.06em); 
        }

        /* 连字符 '-' */
        .logo-fusion .hyphen {
            margin: 0 8px;
            font-weight: 700;
            color: #00c1ff;
        }

        /* 点 '.' */
        .logo-fusion .dot {
            color: #00c1ff;
            margin-left: 2px;
        }
    </style>
</head>
<body>

    <!-- Logo HTML 代码 -->
    <div class="logo-fusion">
        <span class="badge">TD</span><span class="hyphen">-</span>CLOUD<span class="dot">.</span>
    </div>

</body>
</html>
